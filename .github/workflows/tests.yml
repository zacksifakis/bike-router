name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Node runs frontend/router.js for the browser-vs-Python comparison test.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: pip install numpy scipy networkx pytest
      - name: Run tests
        run: python -m pytest -v
